# Normalize math delimiters; unwrap prose and simple displays, but keep multiline math rows.
# Display style: $$ ... $$, with one space immediately inside each delimiter.
# Keep visual wrapping in VS Code.
# Activate with: latexindent -m -rv -l=latexindent.yaml -c=build/ FILE.tex
# Without -m, the modifyLineBreaks settings below are ignored.
defaultIndent: '  '
# Avoid latexindent's default six extra spaces after a list marker.
indentRules:
  item: '  '

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 0
  oneSentencePerLine:
    manipulateSentences: 0
  items:
    ItemStartsOnOwnLine: 1
    ItemFinishesWithLineBreak: -1
  textWrapOptions:
    columns: -1
    removeBlockLineBreaks: 1
    multipleSpacesToSingle: 0
    comments:
      wrap: 0
    blocksBeginWith:
      0-9: 1
      other: '\$(?!\$)|\\(?:emph|textbf|textit|textsc|textrm|textsf|texttt)\{'
    # Do not reflow across displays, environments, or a trailing comment.
    blocksEndBefore:
      other: '\\begin\{|\\\[|\\end\{|\$\$|(?<!\\)%'
    blocksFollow:
      # Resume prose unwrapping after closing $$; normalize displays below.
      other: '\\\]|\\item(?:\h|\[|\R)|\$\$(?=\h*(?:\R|\Z))'

# -rv protects comments and verbatim content before these replacements run.
# Convert paired math delimiters before indentation/reflow, so one pass is stable.
# Do not mistake TeX row breaks such as \\[2pt] for display delimiters.
replacements:
  - when: before
    substitution: 's{(?<!\\)\\\[(.*?)(?<!\\)\\\]}{q{$$} . $1 . q{$$}}gse'
  - when: before
    substitution: 's{(?<!\\)\\\((.*?)(?<!\\)\\\)}{q{$} . $1 . q{$}}gse'
  # Flatten displays only when exported token/comment patterns say it is safe.
  # Keep multiline row displays and protected displays; preserve TeX row breaks (\\).
  - when: after
    substitution: >-
      s{(?<!\\)\$\$((?:(?!\$\$).)*?)\$\$}{
        my $math = $1;
        if ($math =~ /$trailingCommentRegExp/ || index($math, $tokens{beginOfToken}) >= 0) {
          '$$' . $math . '$$';
        } else {
          $math =~ s/\h*\R\h*/ /g unless $math =~ /\\\\/;
          $math =~ s/\A\s+|\s+\z//g;
          '$$ ' . $math . ' $$';
        }
      }gse
