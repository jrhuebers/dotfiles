[opener]
md = [
  { run = "if [ -n \"${HERDR_ENV:-}\" ]; then PAGER='less -R' md %s1; else md %s1; fi", desc = "View Markdown with md", block = true, for = "linux" },
]
pdf = [
  { run = "xdg-open %s1", desc = "Open PDF", orphan = true, for = "linux" },
]

[open]
prepend_rules = [
  { url = "*.md", use = "md" },
  { mime = "application/pdf", use = "pdf" },
]
