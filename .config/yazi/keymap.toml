[mgr]
prepend_keymap = [
  { on = "o", run = """shell --block -- if [ -n "${TMUX:-}" ]; then window=$(tmux new-window -d -P -F "#{window_id}" -c "%d1" sh -c 'sleep 1.1; exec "$0" "$1"' "${EDITOR:-vi}" "%s1") && sleep 1 && tmux select-window -t "$window"; else "${EDITOR:-vi}" "%s1"; fi""", desc = "Open in new tmux window" },
  { on = "O", run = 'shell --block -- if [ -n "${TMUX:-}" ]; then tmux new-window -d -c "%d1" "${EDITOR:-vi}" "%s1"; else "${EDITOR:-vi}" "%s1"; fi', desc = "Open in background tmux window" },
]
