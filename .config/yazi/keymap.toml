[mgr]
prepend_keymap = [
  { on = "e", run = 'shell --block -- if [ -n "${TMUX:-}" ]; then tmux new-window -c "%d1" "${EDITOR:-vi}" "%s1"; else "${EDITOR:-vi}" "%s1"; fi', desc = "Edit hovered file in a new tmux window" },
  { on = "o", run = 'shell -- case "%s1" in *.pdf|*.PDF) if [ "$(uname -s)" = Darwin ]; then open "%s1"; else xdg-open "%s1"; fi ;; *) if [ -n "${TMUX:-}" ]; then tmux new-window -c "%d1" "${EDITOR:-vi}" "%s1"; else "${EDITOR:-vi}" "%s1"; fi ;; esac', desc = "Open in new tmux window or system PDF viewer" },
  { on = "O", run = 'shell -- case "%s1" in *.pdf|*.PDF) if [ "$(uname -s)" = Darwin ]; then open "%s1"; else xdg-open "%s1"; fi ;; *) if [ -n "${TMUX:-}" ]; then tmux new-window -d -c "%d1" "${EDITOR:-vi}" "%s1"; else "${EDITOR:-vi}" "%s1"; fi ;; esac', desc = "Open in background tmux window or system PDF viewer" },
]
