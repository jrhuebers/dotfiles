# style name or JSON path (default "auto")
style: "light"
# mouse support (TUI-mode only)
mouse: false
# use pager to display markdown
pager: false
# display with TUI
tui: true
# word-wrap at width (0 disables wrapping)
width: 0
# show all files, including hidden and ignored.
all: false
# reflow single newlines; keep blank-line paragraph breaks
preserveNewLines: false
